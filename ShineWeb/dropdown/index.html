<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiselect Dropdown - Store Selection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="header">
                <h1>🏪 Store Selection</h1>
                <p>Select one or multiple stores from the list below</p>
            </div>

            <form id="storeForm">
                <div class="form-group">
                    <label for="storeDropdown">
                        Select Store <span class="required">*</span>
                    </label>
                    <div id="storeDropdown" class="multiselect-container"></div>
                    <p class="info-text">You can select multiple stores. Use the search to filter.</p>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-primary" onclick="handleSubmit()">
                        ✓ Submit Selection
                    </button>
                    <button type="button" class="btn-secondary" onclick="handleReset()">
                        ↺ Reset
                    </button>
                </div>
            </form>

            <div id="selectedDisplay" class="selected-display">
                <h3>📋 Selected Stores</h3>
                <div class="selected-items-list" id="selectedList"></div>
            </div>

            <div id="emptyState" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 16 16 12 12 8 8 12 12 16"></polyline>
                </svg>
                <p>No stores selected yet</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // ============================================
        // FIELD DECLARATION - Store Data
        // ============================================
        const storeData = [
            { ID: "356", Name: "@DOOR STEP SUPER MARKET " },
            { ID: "744", Name: "112233 " },
            { ID: "743", Name: "27052025_CUST41 " },
            { ID: "234", Name: "4 ANKADI " },
            { ID: "262", Name: "63IDEAS INFOLABS PRIVATE LIMITED " },
            { ID: "21", Name: "A N FOOD BASKET " },
            { ID: "23", Name: "A TO Z DEPARTMENTAL AND CAFETERIA " },
            { ID: "78", Name: "A.N EXPORTS PVT LTD " }
        ];

        // ============================================
        // FIELD INITIALIZATION - Create Dropdown Instance
        // ============================================
        let storeDropdown;

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the dropdown
            storeDropdown = new MultiSelectDropdown({
                containerId: 'storeDropdown',
                data: storeData,
                idField: 'ID',
                nameField: 'Name',
                placeholder: '🔍 Search or select stores...',
                maxHeight: '350px'
            });
        });

        // ============================================
        // GET SELECTED DATA
        // ============================================
        function getSelectedStores() {
            return storeDropdown.getSelected();
        }

        // ============================================
        // FORM SUBMISSION HANDLER
        // ============================================
        function handleSubmit() {
            const selected = getSelectedStores();
            const selectedDisplay = document.getElementById('selectedDisplay');
            const selectedList = document.getElementById('selectedList');
            const emptyState = document.getElementById('emptyState');

            if (selected.length > 0) {
                selectedList.innerHTML = selected
                    .map(item => `<div class="selected-item-badge">${item.Name.trim()}</div>`)
                    .join('');
                selectedDisplay.classList.add('show');
                emptyState.style.display = 'none';
                
                // Log selected data
                console.log('Selected Stores:', selected);
                
                // Send to server or process data
                // Example: submitToServer(selected);
                
                alert(`✓ Success! You selected ${selected.length} store(s)`);
            } else {
                selectedDisplay.classList.remove('show');
                emptyState.style.display = 'block';
                alert('⚠ Please select at least one store');
            }
        }

        // ============================================
        // FORM RESET HANDLER
        // ============================================
        function handleReset() {
            storeDropdown.clear();
            document.getElementById('selectedDisplay').classList.remove('show');
            document.getElementById('emptyState').style.display = 'block';
        }

        // ============================================
        // EXAMPLE: ASSIGN SELECTED VALUES
        // ============================================
        function assignSelectedStores(storeIds) {
            // storeIds should be array like ['356', '21', '744']
            storeDropdown.setSelected(storeIds);
        }

        // ============================================
        // EXAMPLE: You can call from console or anywhere
        // ============================================
        // assignSelectedStores(['356', '21']); // Pre-select stores
        // getSelectedStores(); // Get current selection
        // storeDropdown.clear(); // Clear selection
    </script>
</body>
</html>
